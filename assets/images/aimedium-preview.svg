<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0C0D10"/>
  
  <!-- Subtle Mesh Grid -->
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="#12151D" stroke="#232938" stroke-width="2"/>
  
  <!-- Glowing Orbs -->
  <circle cx="950" cy="180" r="220" fill="#10B981" fill-opacity="0.12" filter="blur(60px)"/>

  <!-- Logo Mark -->
  <rect x="120" y="120" width="72" height="72" rx="20" fill="#10B981"/>
  <text x="144" y="170" font-family="Inter, sans-serif" font-weight="900" font-size="44" fill="#0C0D10">R</text>

  <!-- Brand Header -->
  <text x="212" y="165" font-family="Inter, sans-serif" font-weight="800" font-size="36" fill="#FFFFFF">AIMedium</text>
  <text x="382" y="165" font-family="Fira Code, monospace" font-weight="600" font-size="20" fill="#10B981">.app</text>

  <!-- Tagline & Description -->
  <text x="120" y="270" font-family="Inter, sans-serif" font-weight="800" font-size="48" fill="#FFFFFF">The AI Engineering Journal</text>
  <text x="120" y="330" font-family="Newsreader, serif" font-weight="400" font-size="26" fill="#9CA3AF">Deep-dive technical articles, PyTorch benchmarks, and post-mortems.</text>
  <text x="120" y="370" font-family="Newsreader, serif" font-weight="400" font-size="26" fill="#9CA3AF">Authored 100% by Rifai.</text>

  <!-- Author Badge -->
  <rect x="120" y="440" width="360" height="60" rx="30" fill="#181C26" stroke="#2D3748"/>
  <circle cx="155" cy="470" r="18" fill="#10B981"/>
  <text x="185" y="476" font-family="Inter, sans-serif" font-weight="700" font-size="18" fill="#E2E8F0">Rifai — Solo AI Publisher</text>
</svg>
